<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compose - Workspace Mail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #0052cc;
            --dark: #0f172a;
            --bg: #f8fafc;
            --border: #e2e8f0;
            --text: #1e293b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--text); }

        .navbar {
            background-color: var(--dark); padding: 12px 24px;
            display: flex; justify-content: space-between; align-items: center;
            color: white; border-bottom: 3px solid var(--primary);
            position: sticky; top: 0; z-index: 100;
        }
        .brand { font-size: 1.1em; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .back-link { color: #cbd5e1; text-decoration: none; font-size: 0.9em; transition: color 0.2s; display: flex; align-items: center; gap: 6px; }
        .back-link:hover { color: white; }

        .container-compose { max-width: 650px; margin: 40px auto; padding: 0 20px; }

        .compose-card {
            background: white; border: 1px solid var(--border);
            border-radius: 8px; padding: 35px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .compose-card h3 {
            font-size: 1.3em; font-weight: 600; margin-bottom: 20px;
            border-bottom: 1px solid var(--border); padding-bottom: 15px;
            display: flex; align-items: center; gap: 10px;
        }

        .alert-msg {
            display: none; padding: 10px 14px; border-radius: 6px;
            margin-bottom: 20px; font-size: 0.85em; font-weight: 500;
            align-items: center; gap: 8px;
        }
        .alert-success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
        .alert-error   { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }

        .form-label { font-size: 0.85em; font-weight: 600; color: #475569; margin-bottom: 5px; display: block; }
        .field-group { margin-bottom: 18px; }

        .input-wrapper { position: relative; }
        .input-icon {
            position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
            color: #aaa; font-size: 0.9em; pointer-events: none; transition: color 0.3s;
        }
        .input-icon.top { top: 14px; transform: none; }

        .form-control {
            width: 100%; padding: 11px 11px 11px 38px;
            border: 1px solid var(--border); border-radius: 6px;
            font-size: 0.95em; color: var(--text); transition: all 0.2s; background: #fafafa;
        }
        textarea.form-control { padding: 11px 11px 11px 38px; resize: vertical; }
        .form-control:focus {
            border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,82,204,0.1);
            outline: none; background: white;
        }
        .input-wrapper:focus-within .input-icon { color: var(--primary); }
        .form-control.is-invalid { border-color: #dc3545; }
        .invalid-feedback { display: block; font-size: 0.76em; color: #dc3545; margin-top: 4px; }

        .btn-toolbar {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 25px; padding-top: 20px; border-top: 1px solid var(--border);
        }
        .btn-cancel {
            color: #64748b; text-decoration: none; padding: 9px 18px;
            font-weight: 500; border-radius: 6px; transition: background 0.2s; font-size: 0.9em;
        }
        .btn-cancel:hover { background: #f1f5f9; color: var(--text); }
        .btn-send {
            background: var(--primary); color: white; border: none;
            padding: 9px 24px; border-radius: 6px; font-weight: 600;
            cursor: pointer; transition: background 0.2s, transform 0.2s;
            display: inline-flex; align-items: center; gap: 8px; font-size: 0.9em;
        }
        .btn-send:hover { background: #0043a6; transform: translateY(-1px); }
        .btn-send:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
    </style>
</head>
<body>

<header class="navbar">
    <div class="brand">
        <i class="fas fa-network-wired"></i> Workspace Mail
    </div>
    <a href="page.html" class="back-link">
        <i class="fas fa-arrow-left"></i> Back to Inbox
    </a>
</header>

<div class="container-compose">
    <div class="compose-card">
        <h3><i class="far fa-envelope"></i> New Transmission</h3>

        <div class="alert-msg alert-success" id="successMsg">
            <i class="fas fa-check-circle"></i> Message transmitted successfully.
        </div>
        <div class="alert-msg alert-error" id="errorMsg">
            <i class="fas fa-exclamation-triangle"></i> Transmission failed. Verify recipient address.
        </div>

        <form id="composeForm" novalidate>
            <div class="field-group">
                <label class="form-label">Recipient Address</label>
                <div class="input-wrapper">
                    <i class="fas fa-user input-icon"></i>
                    <input type="email" id="receiver" class="form-control" placeholder="user@company.com">
                </div>
                <div class="invalid-feedback" id="receiverError"></div>
            </div>
            <div class="field-group">
                <label class="form-label">Subject</label>
                <div class="input-wrapper">
                    <i class="fas fa-tag input-icon"></i>
                    <input type="text" id="subject" class="form-control" placeholder="Re: Project Update">
                </div>
                <div class="invalid-feedback" id="subjectError"></div>
            </div>
            <div class="field-group">
                <label class="form-label">Message Payload</label>
                <div class="input-wrapper">
                    <i class="fas fa-align-left input-icon top"></i>
                    <textarea id="body" class="form-control" rows="8" placeholder="Enter your message here..."></textarea>
                </div>
                <div class="invalid-feedback" id="bodyError"></div>
            </div>
            <div class="btn-toolbar">
                <a href="page.html" class="btn-cancel">Cancel</a>
                <button type="submit" class="btn-send" id="sendBtn">
                    <i class="fas fa-paper-plane"></i> Transmit
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    // Pre-fill from URL params (reply functionality)
    const params = new URLSearchParams(window.location.search);
    if (params.get('replyTo'))  document.getElementById('receiver').value = params.get('replyTo');
    if (params.get('subject'))  document.getElementById('subject').value  = 'Re: ' + params.get('subject');
    if (params.get('msg'))   { const el = document.getElementById('successMsg'); el.style.display = 'flex'; }
    if (params.get('error')) { const el = document.getElementById('errorMsg');   el.style.display = 'flex'; }

    document.getElementById('composeForm').addEventListener('submit', function (e) {
        e.preventDefault();
        let valid = true;

        const receiver = document.getElementById('receiver');
        const subject  = document.getElementById('subject');
        const body     = document.getElementById('body');

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(receiver.value.trim())) {
            setInvalid(receiver, 'receiverError', "Please include an '@' in the email address.");
            valid = false;
        } else { setValid(receiver, 'receiverError'); }

        if (subject.value.trim().length < 2) {
            setInvalid(subject, 'subjectError', 'Please enter a subject.');
            valid = false;
        } else { setValid(subject, 'subjectError'); }

        if (body.value.trim().length < 5) {
            setInvalid(body, 'bodyError', 'Please enter a message.');
            valid = false;
        } else { setValid(body, 'bodyError'); }

        if (valid) {
            const btn = document.getElementById('sendBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Sending...';
            setTimeout(() => {
                document.getElementById('successMsg').style.display = 'flex';
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Transmit';
                document.getElementById('composeForm').reset();
            }, 1500);
        }
    });

    function setInvalid(input, errorId, msg) {
        input.classList.add('is-invalid');
        document.getElementById(errorId).textContent = msg;
    }
    function setValid(input, errorId) {
        input.classList.remove('is-invalid');
        document.getElementById(errorId).textContent = '';
    }
</script>
</body>
</html>
