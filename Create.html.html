
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Intranet Workspace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #0052cc;
            --primary-hover: #0043a6;
            --dark: #0f172a;
            --bg: #f1f5f9;
            --border: #e2e8f0;
            --text: #1e293b;
            --muted: #64748b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 30px 30px;
            padding: 20px;
        }
        .wrapper {
            display: flex; width: 900px; min-height: 580px;
            background: white; border-radius: 12px; overflow: hidden;
            box-shadow: 0 10px 40px rgba(15,23,42,0.12);
            border: 1px solid var(--border);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .left-panel {
            flex: 1; background-color: var(--dark);
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            padding: 50px 40px; color: white;
            display: flex; flex-direction: column; justify-content: center;
            border-right: 1px solid rgba(255,255,255,0.1);
        }
        .brand-icon {
            width: 50px; height: 50px; background: var(--primary);
            border-radius: 8px; display: flex; align-items: center;
            justify-content: center; font-size: 1.5em; margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,82,204,0.4);
        }
        .left-panel h2 { font-size: 1.7em; font-weight: 600; margin-bottom: 15px; color: #f8fafc; }
        .left-panel p  { font-size: 0.95em; color: #94a3b8; line-height: 1.6; }
        .right-panel { flex: 1.1; padding: 50px; display: flex; flex-direction: column; justify-content: center; }
        .right-panel h3 { font-size: 1.6em; font-weight: 600; color: var(--text); margin-bottom: 8px; }
        .subtitle { color: var(--muted); font-size: 0.9em; margin-bottom: 25px; }
        .alert-msg {
            display: none; padding: 12px; border-radius: 6px;
            margin-bottom: 18px; font-size: 0.85em; font-weight: 500;
        }
        .alert-error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; animation: shake 0.4s ease; }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25%      { transform: translateX(-5px); }
            75%      { transform: translateX(5px); }
        }
        .form-label { font-weight: 500; color: var(--text); font-size: 0.85em; margin-bottom: 6px; display: block; }
        .field-group { margin-bottom: 16px; }
        .input-wrapper { position: relative; }
        .input-icon {
            position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
            color: #aaa; font-size: 0.9em; pointer-events: none; transition: color 0.3s;
        }
        .form-control {
            width: 100%; padding: 11px 11px 11px 38px;
            border: 1px solid var(--border); border-radius: 6px;
            font-size: 0.95em; color: var(--text); transition: all 0.2s; background: #fafafa;
        }
        .form-control:focus {
            border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,82,204,0.1);
            outline: none; background: white;
        }
        .input-wrapper:focus-within .input-icon { color: var(--primary); }
        .toggle-password {
            position: absolute; right: 13px; top: 50%; transform: translateY(-50%);
            cursor: pointer; color: #aaa; font-size: 0.9em; transition: color 0.3s;
        }
        .toggle-password:hover { color: var(--primary); }
        .form-control.is-invalid { border-color: #dc3545; }
        .invalid-feedback { display: block; font-size: 0.76em; color: #dc3545; margin-top: 4px; }
        .btn-register {
            width: 100%; padding: 12px; background: var(--primary);
            border: 1px solid var(--primary-hover); border-radius: 6px;
            color: white; font-size: 0.95em; font-weight: 600;
            cursor: pointer; transition: background 0.2s, transform 0.2s; margin-top: 6px;
        }
        .btn-register:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn-register:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
        .divider {
            text-align: center; color: var(--muted); font-size: 0.85em;
            margin: 20px 0; position: relative;
        }
        .divider::before, .divider::after {
            content: ''; position: absolute; top: 50%; width: 42%; height: 1px; background: var(--border);
        }
        .divider::before { left: 0; } .divider::after { right: 0; }
        .login-link { text-align: center; font-size: 0.9em; color: var(--muted); }
        .login-link a { color: var(--primary); font-weight: 600; text-decoration: none; }
        .login-link a:hover { text-decoration: underline; }
        @media (max-width: 768px) {
            .wrapper { flex-direction: column; width: 100%; }
            .left-panel, .right-panel { padding: 35px 25px; }
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="left-panel">
        <div class="brand-icon"><i class="fas fa-user-plus"></i></div>
        <h2>Join Workspace</h2>
        <p>Request an account to access internal tools, collaborate with your team, and manage your communications securely.</p>
    </div>
    <div class="right-panel">
        <h3>Create Account</h3>
        <p class="subtitle">Enter your details to provision a new user profile</p>
        <div class="alert-msg alert-error" id="errorMsg">
            <i class="fas fa-exclamation-triangle me-2"></i>
            <span id="errorText">Registration failed. Please try again.</span>
        </div>
        <form id="registerForm" novalidate>
            <div class="field-group">
                <label class="form-label">Full Name</label>
                <div class="input-wrapper">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" id="fullName" class="form-control" placeholder="Enter your full name">
                </div>
                <div class="invalid-feedback" id="nameError"></div>
            </div>
            <div class="field-group">
                <label class="form-label">Corporate Email</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="email" class="form-control" placeholder="name@company.com">
                </div>
                <div class="invalid-feedback" id="emailError"></div>
            </div>
            <div class="field-group">
                <label class="form-label">Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" class="form-control" placeholder="Create a password">
                    <i class="fas fa-eye toggle-password" id="togglePwd"></i>
                </div>
                <div class="invalid-feedback" id="passwordError"></div>
            </div>
            <div class="field-group">
                <label class="form-label">Confirm Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm your password">
                    <i class="fas fa-eye toggle-password" id="toggleConfirm"></i>
                </div>
                <div class="invalid-feedback" id="confirmError"></div>
            </div>
            <button type="submit" class="btn-register" id="regBtn">
                <i class="fas fa-user-plus me-2"></i> Create Account
            </button>
        </form>
        <div class="divider">or</div>
        <div class="login-link">
            Already provisioned? <a href="registration.html">Return to Login</a>
        </div>
    </div>
</div>
<script>
    document.getElementById('togglePwd').addEventListener('click', function () {
        const pwd = document.getElementById('password');
        const isPass = pwd.type === 'password';
        pwd.type = isPass ? 'text' : 'password';
        this.classList.toggle('fa-eye', !isPass);
        this.classList.toggle('fa-eye-slash', isPass);
    });

    document.getElementById('toggleConfirm').addEventListener('click', function () {
        const pwd = document.getElementById('confirmPassword');
        const isPass = pwd.type === 'password';
        pwd.type = isPass ? 'text' : 'password';
        this.classList.toggle('fa-eye', !isPass);
        this.classList.toggle('fa-eye-slash', isPass);
    });

    document.getElementById('registerForm').addEventListener('submit', function (e) {
        e.preventDefault();
        let valid = true;

        const fullName  = document.getElementById('fullName');
        const email     = document.getElementById('email');
        const password  = document.getElementById('password');
        const confirm   = document.getElementById('confirmPassword');

        if (fullName.value.trim().length < 3) {
            setInvalid(fullName, 'nameError', 'Please enter your full name (min 3 characters).');
            valid = false;
        } else { setValid(fullName, 'nameError'); }

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim())) {
            setInvalid(email, 'emailError', "Please include an '@' in the email address.");
            valid = false;
        } else { setValid(email, 'emailError'); }

        if (password.value.length < 6) {
            setInvalid(password, 'passwordError', 'Password must be at least 6 characters.');
            valid = false;
        } else { setValid(password, 'passwordError'); }

        if (confirm.value !== password.value || confirm.value === '') {
            setInvalid(confirm, 'confirmError', 'Passwords do not match.');
            valid = false;
        } else { setValid(confirm, 'confirmError'); }

        if (valid) {
            const btn = document.getElementById('regBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin me-2"></i> Processing...';
            setTimeout(() => { window.location.href = 'registration.html?msg=1'; }, 1500);
        }
    });

    function setInvalid(input, errorId, msg) {
        input.classList.add('is-invalid');
        document.getElementById(errorId).textContent = msg;
    }
    function setValid(input, errorId) {
        input.classList.remove('is-invalid');
        document.getElementById(errorId).textContent = '';
    }
</script>
</body>
</html>
